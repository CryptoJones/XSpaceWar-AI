name: xspacewar-ai
base: core24
version: "2.1.2"
title: XSpaceWar-AI
summary: AI-driven networked space-fighter with real Newtonian physics
description: |
  A 2026 reimagining of the classic networked Spacewar! — top-down dogfights
  around a gravity well with true Newtonian physics, 100% procedurally generated
  graphics and audio, brutal AI (Rookie to Insane), and LAN + internet
  multiplayer for up to 16 ships. Built in Godot 4. Free and open source
  (Apache-2.0).
grade: stable
confinement: strict
license: Apache-2.0
website: https://cryptojones.github.io/XSpaceWar-AI/
contact: https://github.com/CryptoJones/XSpaceWar-AI/issues
issues: https://github.com/CryptoJones/XSpaceWar-AI/issues
source-code: https://github.com/CryptoJones/XSpaceWar-AI

apps:
  xspacewar-ai:
    command: xspacewar-ai.x86_64
    extensions: [gnome]
    plugs:
      - opengl
      - x11
      - wayland
      - audio-playback
      - network
      - network-bind
      - joystick

parts:
  game:
    # Built from source in-build: pull the OFFICIAL Godot engine + export
    # templates (identical to the project's public GitHub Actions CI), then
    # export this exact tagged source tree. No prebuilt or opaque binary is
    # downloaded — the executable is produced here from the public Apache-2.0
    # source at the tag below.
    plugin: nil
    source: https://github.com/CryptoJones/XSpaceWar-AI.git
    source-type: git
    source-tag: v2.1.2
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
      - libfreetype6
    build-environment:
      - GODOT_VERSION: "4.6.3"
    override-build: |
      set -eux
      PROJ="$CRAFT_PART_SRC"
      WORK="$CRAFT_PART_BUILD"
      export HOME="$WORK/buildhome"
      TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TPL"

      # Official Godot headless editor binary (used to run the export).
      curl -sSL -o "$WORK/godot.zip" \
        "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
      unzip -q -o "$WORK/godot.zip" -d "$WORK/godotbin"
      install -m755 "$WORK/godotbin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      # Official export templates.
      curl -sSL -o "$WORK/templates.tpz" \
        "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -q -o "$WORK/templates.tpz" -d "$WORK/tpl"
      mv "$WORK/tpl/templates/"* "$TPL/"

      # Import + export the Linux build from THIS source (embed_pck -> one file).
      godot --headless --path "$PROJ" --import || true
      mkdir -p "$PROJ/build/out/linux"
      godot --headless --path "$PROJ" --export-release "Linux"

      install -D -m755 "$PROJ/build/out/linux/xspacewar-ai.x86_64" \
        "$CRAFT_PART_INSTALL/xspacewar-ai.x86_64"
