name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.6.3"
  GODOT_LINUX_SHA256: "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3"
  GODOT_TEMPLATES_SHA256: "3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8"

jobs:
  test:
    name: Headless test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import project
        run: godot --headless --path . --import || true

      # Each suite must exit 0 AND emit no SCRIPT ERROR — a runtime error
      # aborts a test function silently, skipping its remaining checks.
      - name: Sim tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Combat tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/combat_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Bot AI tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/bot_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Gameplay tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/gameplay_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Net tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/net_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Relay tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/relay_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Audio tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/audio_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Scene smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/scene_smoke.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: UI smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/ui_smoke.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: i18n tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/i18n_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Aim-anomaly tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/aim_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Dedicated moderation tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/dedicated_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log

  build:
    name: Export ${{ matrix.preset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            out_dir: build/out/linux
            artifact: xspacewar-ai-linux-x86_64
          - preset: Windows
            out_dir: build/out/windows
            artifact: xspacewar-ai-windows-x86_64
          - preset: macOS
            out_dir: build/out/macos
            artifact: xspacewar-ai-macos-universal-raw
    steps:
      - uses: actions/checkout@v6

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_LINUX_SHA256}  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_TEMPLATES_SHA256}  templates.tpz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "${{ matrix.out_dir }}"
          godot --headless --path . --export-release "${{ matrix.preset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out_dir }}
          if-no-files-found: error

  sign-macos:
    name: Sign macOS app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: xspacewar-ai-macos-universal-raw
          path: unsigned
      - name: Import Developer ID identity
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/import-developer-id.sh
      - name: Sign and package macOS app
        run: |
          mkdir -p payload signed
          ditto -x -k unsigned/xspacewar-ai-macos.zip payload
          app="$(find payload -type d -name 'XSpaceWar-AI.app' -print -quit)"
          test -n "$app"
          ./.github/scripts/sign-macos-app.sh "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            signed/xspacewar-ai-macos-universal.zip
          (cd signed && shasum -a 256 xspacewar-ai-macos-universal.zip \
            > xspacewar-ai-macos-universal.zip.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: xspacewar-ai-macos-universal
          path: signed
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/developer-id.keychain-db" 2>/dev/null || true

  release:
    name: Tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xspacewar-ai-linux-x86_64
          path: dist/linux
      - uses: actions/download-artifact@v8
        with:
          name: xspacewar-ai-windows-x86_64
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: xspacewar-ai-macos-universal
          path: dist/macos

      - name: Zip per platform
        run: |
          cd dist
          # download-artifact strips POSIX modes — restore the executable bit
          chmod +x */xspacewar-ai.x86_64 2>/dev/null || true
          (cd linux && zip -r ../xspacewar-ai-linux-x86_64.zip .)
          (cd windows && zip -r ../xspacewar-ai-windows-x86_64.zip .)
          mv macos/xspacewar-ai-macos-universal.zip* .
          ls -la *.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          append_body: true
          body: |
            ### Opening on macOS
            The macOS app is Developer ID signed as Aaron Clark but is not notarized.
            The signature protects integrity and identifies the publisher, but Gatekeeper may
            still block the unnotarized download. If that happens, clear its quarantine flag:

            ```sh
            xattr -dr com.apple.quarantine /path/to/XSpaceWar-AI.app
            ```

            Verify the matching `.sha256` manifest before bypassing quarantine.
