name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.6.3"

jobs:
  test:
    name: Headless test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import project
        run: godot --headless --path . --import || true

      # Each suite must exit 0 AND emit no SCRIPT ERROR — a runtime error
      # aborts a test function silently, skipping its remaining checks.
      - name: Sim tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Combat tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/combat_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Bot AI tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/bot_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Gameplay tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/gameplay_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Net tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/net_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Relay tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/relay_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Audio tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/audio_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Scene smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/scene_smoke.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: UI smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/ui_smoke.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: i18n tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/i18n_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log
      - name: Aim-anomaly tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/aim_tests.gd 2>&1 | tee /tmp/t.log
          ! grep -q "SCRIPT ERROR" /tmp/t.log

  build:
    name: Export ${{ matrix.preset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            out_dir: build/out/linux
            artifact: xspacewar-ai-linux-x86_64
          - preset: Windows
            out_dir: build/out/windows
            artifact: xspacewar-ai-windows-x86_64
          - preset: macOS
            out_dir: build/out/macos
            artifact: xspacewar-ai-macos-universal
    steps:
      - uses: actions/checkout@v6

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "${{ matrix.out_dir }}"
          godot --headless --path . --export-release "${{ matrix.preset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out_dir }}
          if-no-files-found: error

  release:
    name: Tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Zip per platform
        run: |
          cd dist
          # download-artifact strips POSIX modes — restore the executable bit
          chmod +x */xspacewar-ai.x86_64 2>/dev/null || true
          # macOS: Godot already exports a zip (signed app inside). Ship THAT
          # directly — re-zipping made downloaders unzip twice.
          if [ -f xspacewar-ai-macos-universal/xspacewar-ai-macos.zip ]; then
            mv xspacewar-ai-macos-universal/xspacewar-ai-macos.zip xspacewar-ai-macos-universal.zip
            rm -rf xspacewar-ai-macos-universal
          fi
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          ls -la *.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          append_body: true
          body: |
            ### Opening on macOS
            No paid Apple Developer account yet, so the macOS build is ad-hoc signed but not
            notarized. On first launch Gatekeeper may say **"XSpaceWar-AI is damaged and can't
            be opened."** It is **not** damaged — macOS just quarantines un-notarized downloads.
            Clear the quarantine flag in Terminal and it opens normally:

            ```sh
            xattr -dr com.apple.quarantine /path/to/XSpaceWar-AI.app
            ```

            Right-click → **Open** (and System Settings → **Open Anyway**) do **not** clear the
            "damaged" warning — only the command above does.
